name: Build and Release

on:
  push:
    branches: [trunk]
    tags: ["v*"]
  pull_request:
    branches: [trunk]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: CGO_ENABLED=0 go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/deanmarano/dokkufile/cmd.Version=${VERSION} -X github.com/deanmarano/dokkufile/cmd.Commit=${COMMIT} -X github.com/deanmarano/dokkufile/cmd.Date=${DATE}"
          go build -ldflags "${LDFLAGS}" -o dokkufile-linux-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: dokkufile-linux-${{ matrix.arch }}
          path: dokkufile-linux-${{ matrix.arch }}

  release:
    needs: build
    if: github.ref == 'refs/heads/trunk' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release (latest)
        if: github.ref == 'refs/heads/trunk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          name: Latest Build
          files: artifacts/dokkufile-linux-*
      - name: Release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dokkufile-linux-*
