name: Integration Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      dokku_version:
        description: "Specific Dokku version to test (leave empty for all)"
        required: false
        type: string

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: CGO_ENABLED=0 go test ./...

  integration:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dokku_version:
          - "0.34.9"
          - "0.35.20"
          - "0.36.11"
          - "0.37.6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests (Dokku ${{ matrix.dokku_version }})
        env:
          DOKKU_VERSION: ${{ matrix.dokku_version }}
        run: ./tests/integration/run.sh
