version: "1"

services:
  myapp-cache:
    type: redis
    image_version: "7"

plugins:
  redis:
    url: https://github.com/dokku/dokku-redis.git

apps:
  myapp:
    image: myorg/myapp:latest

    domains:
      - api.example.com

    ports:
      http:80: "8080"
      https:443: "8080"

    env:
      NODE_ENV: production

    secrets:
      - REDIS_URL
      - JWT_SECRET

    links:
      redis: myapp-cache

    letsencrypt: true

    scale:
      web: 1

    resources:
      web:
        limits:
          cpu: "1.0"
          memory: 512M
        reservations:
          cpu: "0.25"
          memory: 128M

    logs:
      max_size: 50m

    checks:
      wait_to_retire: 30
